[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-document-fraud-detection"
version = "0.1.0"
description = "Multi-Modal AI Pipeline for Trade Document Fraud Detection & Compliance Auditing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Trade Fraud Detection Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # OCR & Image Processing
    "pytesseract>=0.3.13",
    "easyocr>=1.7.2",
    "pdf2image>=1.17.0",
    "Pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "scikit-image>=0.24.0",

    # Deep Learning
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "ultralytics>=8.3.0",
    "transformers>=4.44.0",

    # NLP
    "spacy>=3.8.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Dashboard
    "streamlit>=1.40.0",
    "plotly>=5.24.0",

    # Utilities
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = ["E501"]  # Line length handled separately

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "preprocessing", "image_analytics", "nlp", "fusion", "risk", "db", "dashboard"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "pytesseract.*",
    "easyocr.*",
    "ultralytics.*",
    "pdf2image.*",
    "streamlit.*",
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
]
