services:
  # ── API Server ─────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - upload_data:/app/data/uploads

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud_pipeline
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: trade_fraud_audit
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_pipeline -d trade_fraud_audit"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Streamlit Dashboard ────────────────────────────────────────────────
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  upload_data:
